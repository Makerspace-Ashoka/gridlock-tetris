name: gridlock

services:
  edge:
    image: caddy:2-alpine
    container_name: gridlock-edge
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # The LAN resolver wildcards the inherited search domain
    # (local.makerspace.tools), so an undeployed backend such as
    # gridlock-prod or a torn-down gridlock-pr-<n> would resolve to an
    # unrelated host instead of NXDOMAIN, and the edge would proxy there.
    # Dropping the search list keeps single-label lookups on Docker DNS and
    # lets missing environments fall through to handle_errors.
    dns_search: ["."]
    networks: [gridlock]

  prod:
    image: ghcr.io/makerspace-ashoka/gridlock-tetris:prod
    container_name: gridlock-prod
    restart: unless-stopped
    networks: [gridlock]

  dev:
    image: ghcr.io/makerspace-ashoka/gridlock-tetris:dev
    container_name: gridlock-dev
    restart: unless-stopped
    networks: [gridlock]

networks:
  gridlock:
    name: gridlock
    external: true
