name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/makerspace-ashoka/gridlock-tetris

jobs:
  build:
    name: Build and push preview image
    # Fork PRs never reach the self-hosted runner and never push images.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/makerspace-ashoka/gridlock-tetris:pr-${{ github.event.pull_request.number }}

  deploy:
    name: Deploy preview
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gridlock]
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run preview container
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          N="$PR_NUMBER"
          docker pull "$IMAGE:pr-$N"
          docker rm -f "gridlock-pr-$N" 2>/dev/null || true
          docker run -d \
            --name "gridlock-pr-$N" \
            --network gridlock \
            --restart unless-stopped \
            --label gridlock.role=pr \
            "$IMAGE:pr-$N"

      - name: Smoke test
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          N="$PR_NUMBER"
          # Do not pipe curl into grep -q: grep exits at the first match and
          # closes the pipe, so curl dies with a write error (exit 23) even
          # though the deploy succeeded. Write to a file, then grep the file.
          OUT="$RUNNER_TEMP/gridlock-smoke.html"
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsS "http://localhost:8080/pr/$N/" -o "$OUT"
          grep -qi gridlock "$OUT"

      - name: Sticky preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- gridlock-preview -->';
            const n = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              '### GRIDLOCK preview ready',
              '',
              `- Preview: https://tetris.makerspace.tools/pr/${n}`,
              `- LAN: http://192.168.8.3:8080/pr/${n}`,
              `- Deployed commit: \`${sha}\``,
              '',
              '_The preview container is destroyed when this PR closes._',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
                body,
              });
            }
