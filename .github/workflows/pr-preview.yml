name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Used by upstream-sync.yml: PRs opened with GITHUB_TOKEN do not emit
  # pull_request events, so the preview has to be requested explicitly.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of an open PR in this repository to preview'
        required: true
        type: string

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/makerspace-ashoka/gridlock-tetris

jobs:
  context:
    name: Resolve PR context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.resolve.outputs.number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      state: ${{ steps.resolve.outputs.state }}
      eligible: ${{ steps.resolve.outputs.eligible }}
    steps:
      - name: Resolve PR number, head and eligibility
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EV_NUMBER: ${{ github.event.pull_request.number }}
          EV_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EV_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EV_STATE: ${{ github.event.pull_request.state }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            NUMBER="$EV_NUMBER"
            HEAD_SHA="$EV_HEAD_SHA"
            HEAD_REPO="$EV_HEAD_REPO"
            STATE="$EV_STATE"
          else
            case "$INPUT_PR" in
              ''|*[!0-9]*)
                echo "pr_number must be a positive integer, got '$INPUT_PR'" >&2
                exit 1
                ;;
            esac
            DATA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" \
              --jq '[.number, .head.sha, (.head.repo.full_name // "unknown"), .state] | @tsv')"
            IFS=$'\t' read -r NUMBER HEAD_SHA HEAD_REPO STATE <<< "$DATA"
          fi

          # Same gates on both trigger paths: only open PRs whose head branch
          # lives in THIS repository get built or deployed. Fork code must
          # never reach the self-hosted runner or a registry token, and a
          # dispatch naming a fork PR (or a closed one) must do nothing.
          ELIGIBLE=false
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$STATE" = "open" ]; then
            ELIGIBLE=true
          fi

          {
            echo "number=$NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "head_repo=$HEAD_REPO"
            echo "state=$STATE"
            echo "eligible=$ELIGIBLE"
          } >> "$GITHUB_OUTPUT"

          echo "PR #$NUMBER head=$HEAD_SHA repo=$HEAD_REPO state=$STATE eligible=$ELIGIBLE"
          if [ "$ELIGIBLE" != "true" ]; then
            echo "Skipping preview: PR #$NUMBER is not an open same-repo PR."
          fi

  build:
    name: Build and push preview image
    needs: context
    # Fork PRs never reach the self-hosted runner and never push images.
    if: |
      needs.context.outputs.eligible == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_sha }}

      - name: Ensure packaging files are present
        run: |
          set -euo pipefail
          # An upstream sync branch carries upstream's tree, which has no
          # Dockerfile or deploy/ directory. Borrow the packaging from main so
          # the preview still builds; it is upstream's index.html that matters.
          # Inert for ordinary PRs, which already contain both files.
          if [ ! -f Dockerfile ] || [ ! -f deploy/Caddyfile.app ]; then
            echo "Head commit has no packaging files; restoring them from main."
            git fetch --depth=1 origin main
            git checkout FETCH_HEAD -- Dockerfile deploy/Caddyfile.app
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/makerspace-ashoka/gridlock-tetris:pr-${{ needs.context.outputs.number }}

  deploy:
    name: Deploy preview
    needs: [context, build]
    if: |
      needs.context.outputs.eligible == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gridlock]
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run preview container
        env:
          PR_NUMBER: ${{ needs.context.outputs.number }}
        run: |
          set -euo pipefail
          N="$PR_NUMBER"
          docker pull "$IMAGE:pr-$N"
          docker rm -f "gridlock-pr-$N" 2>/dev/null || true
          docker run -d \
            --name "gridlock-pr-$N" \
            --network gridlock \
            --restart unless-stopped \
            --label gridlock.role=pr \
            "$IMAGE:pr-$N"

      - name: Smoke test
        env:
          PR_NUMBER: ${{ needs.context.outputs.number }}
        run: |
          set -euo pipefail
          N="$PR_NUMBER"
          # Do not pipe curl into grep -q: grep exits at the first match and
          # closes the pipe, so curl dies with a write error (exit 23) even
          # though the deploy succeeded. Write to a file, then grep the file.
          OUT="$RUNNER_TEMP/gridlock-smoke.html"
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsS "http://localhost:8080/pr/$N/" -o "$OUT"
          grep -qi gridlock "$OUT"

      - name: Sticky preview comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.context.outputs.number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        with:
          script: |
            const marker = '<!-- gridlock-preview -->';
            const n = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA.substring(0, 7);
            const body = [
              marker,
              '### GRIDLOCK preview ready',
              '',
              `- Preview: https://tetris.makerspace.tools/pr/${n}`,
              `- LAN: http://192.168.8.3:8080/pr/${n}`,
              `- Deployed commit: \`${sha}\``,
              '',
              '_The preview container is destroyed when this PR closes._',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
                body,
              });
            }
