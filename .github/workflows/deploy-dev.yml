name: Deploy Dev

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/makerspace-ashoka/gridlock-tetris
  DEPLOY_DIR: /opt/gridlock

jobs:
  build:
    name: Build and push dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/makerspace-ashoka/gridlock-tetris:dev
            ghcr.io/makerspace-ashoka/gridlock-tetris:sha-${{ github.sha }}

  deploy:
    name: Deploy to dev
    needs: build
    runs-on: [self-hosted, gridlock]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync edge config and compose file
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          cp deploy/Caddyfile "$DEPLOY_DIR/Caddyfile"
          cp deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Ensure edge is running with current config
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose up -d edge
          docker compose exec -T edge caddy reload --config /etc/caddy/Caddyfile \
            || docker compose restart edge

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start dev
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose pull dev
          docker compose up -d dev

      - name: Smoke test
        run: |
          set -euo pipefail
          # Do not pipe curl into grep -q: grep exits at the first match and
          # closes the pipe, so curl dies with a write error (exit 23) even
          # though the deploy succeeded. Write to a file, then grep the file.
          OUT="$RUNNER_TEMP/gridlock-smoke.html"
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/dev -o "$OUT"
          grep -qi gridlock "$OUT"
